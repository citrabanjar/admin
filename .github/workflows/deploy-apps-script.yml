# Kirim kode di folder src/ ke Google Apps Script & perbarui deployment Web App
# setiap ada perubahan di branch main.
#
# Butuh 3 Repository secrets (Settings → Secrets and variables → Actions):
#   CLASPRC_JSON   : isi file .clasprc.json hasil `npx @google/clasp@2.4.2 login` (akun admin@citrabanjar.com)
#   SCRIPT_ID      : Script ID project Apps Script (Project Settings → IDs)
#   DEPLOYMENT_ID  : Deployment ID Web App (Deploy → Manage deployments)
name: Deploy ke Apps Script

on:
  push:
    branches: [main]
    paths: ['src/**', '.github/workflows/deploy-apps-script.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apps-script-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pasang clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Cek secrets
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          for v in CLASPRC_JSON SCRIPT_ID DEPLOYMENT_ID; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v belum diisi (Settings → Secrets and variables → Actions)"; exit 1; fi
          done

      - name: Siapkan kredensial
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          echo "$CLASPRC_JSON" > ~/.clasprc.json
          echo "{\"scriptId\":\"$SCRIPT_ID\",\"rootDir\":\"src\"}" > .clasp.json

      - name: Push kode ke Apps Script
        run: |
          set -o pipefail
          if ! clasp push --force 2>&1 | tee push.log; then
            echo "::error title=clasp push gagal::$(tail -c 1500 push.log | tr '\n' ' ')"
            exit 1
          fi

      - name: Perbarui deployment Web App (link tetap sama)
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA::7} — $(git log -1 --pretty=%s | cut -c1-60)"

      - name: Tulis alamat form untuk GitHub Pages (docs/form-url.js)
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          echo "window.FORM_URL = 'https://script.google.com/macros/s/${DEPLOYMENT_ID}/exec';" > docs/form-url.js
          if [ -z "$(git status --porcelain docs/form-url.js)" ]; then echo "Alamat form tidak berubah"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/form-url.js
          git commit -m "Perbarui alamat form Web App"
          git pull --rebase origin main
          git push origin HEAD:main
