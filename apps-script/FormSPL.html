<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root{--navy:#1F3864;--navy2:#2E4C85;--line:#D9DEE7;--bg:#F3F5F9;--ink:#1d2433;--mute:#667085;
        --ok:#1E7B4A;--okbg:#E7F5EC;--warn:#9A6200;--warnbg:#FFF4D6;--err:#B42318;--errbg:#FDECEA;--input:#FFFBEA}
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;font-size:14px;color:var(--ink);background:var(--bg)}
  header{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header .t{flex:1;min-width:200px}
  header h1{margin:0;font-size:17px;letter-spacing:.3px}
  header small{opacity:.8}
  header .u{font-size:12px;text-align:right}
  header button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;margin-top:4px}
  main{max-width:1100px;margin:0 auto;padding:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
  .tabs{display:flex;gap:6px;margin-bottom:12px}
  .tabs button{flex:0 0 auto;border:1px solid var(--line);background:#fff;padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:bold;color:var(--mute)}
  .tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  label{font-size:12px;color:var(--mute);display:block;margin-bottom:4px;font-weight:bold}
  input,select,textarea{font:inherit;padding:8px;border:1px solid #C5CCD8;border-radius:6px;background:var(--input);width:100%}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--navy2);border-color:var(--navy2)}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .row>div{flex:1;min-width:150px}
  .chip{display:inline-block;padding:7px 12px;border-radius:6px;background:#EEF1F6;font-weight:bold;min-height:35px;width:100%}
  .chip.libur{background:var(--errbg);color:var(--err)}
  .chip.kerja{background:var(--okbg);color:var(--ok)}
  .btn{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:11px 18px;font-weight:bold;cursor:pointer;font-size:14px}
  .btn:disabled{background:#A9B3C4;cursor:not-allowed}
  .btn.sec{background:#fff;color:var(--navy);border:1px solid var(--navy)}
  .btn.kecil{padding:6px 10px;font-size:12px}
  .msg{padding:10px 12px;border-radius:8px;margin:10px 0;font-size:13px;line-height:1.45}
  .msg.err{background:var(--errbg);color:var(--err)} .msg.warn{background:var(--warnbg);color:var(--warn)} .msg.ok{background:var(--okbg);color:var(--ok)}
  .hide{display:none!important}
  table{width:100%;border-collapse:collapse}
  th{background:var(--navy);color:#fff;font-size:12px;padding:8px 6px;text-align:center;position:sticky;top:0}
  td{border-bottom:1px solid var(--line);padding:6px;vertical-align:top}
  td.n{text-align:center;color:var(--mute);width:34px;padding-top:14px}
  td.auto{background:#F4F5F7;text-align:center;padding-top:14px;font-weight:bold;white-space:nowrap}
  .sub{font-size:11px;color:var(--mute);margin-top:3px}
  .rowerr{font-size:12px;color:var(--err);margin-top:4px}
  .rowwarn{font-size:12px;color:var(--warn);margin-top:4px}
  .del{background:none;border:0;color:var(--err);font-size:18px;cursor:pointer;padding:6px}
  tfoot td{font-weight:bold;background:#EEF1F6;padding:10px 6px}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:12px}
  .sum{font-size:13px;color:var(--mute)} .sum b{color:var(--ink);font-size:16px}
  .login{max-width:420px;margin:40px auto}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-right-color:transparent;border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes s{to{transform:rotate(360deg)}}
  .st{display:inline-block;font-size:11px;font-weight:bold;padding:3px 8px;border-radius:10px;background:#EEF1F6}
  .st.MENUNGGU{background:var(--warnbg);color:var(--warn)} .st.DISETUJUI{background:var(--okbg);color:var(--ok)}
  .st.DITOLAK,.st.DIBATALKAN{background:var(--errbg);color:var(--err)}
  .rw{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
  .rw .det{display:none;margin-top:8px;font-size:12px}
  .rw.buka .det{display:block}
  .modal{position:fixed;inset:0;background:rgba(16,24,40,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
  .modal .card{max-width:480px;width:100%}
  /* HP: tabel jadi kartu */
  @media (max-width:760px){
    thead{display:none}
    table,tbody,tr,td{display:block;width:100%}
    tbody tr{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;padding:8px;position:relative;background:#fff}
    td{border:0;padding:4px 2px}
    td.n{position:absolute;top:6px;right:40px;width:auto;padding:0;font-weight:bold}
    td.aksi{position:absolute;top:0;right:0;width:auto}
    td.auto{text-align:left;background:none;padding:2px;display:inline-block;width:49%}
    td[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--mute);font-weight:bold;margin-bottom:2px}
    td.jam{display:inline-block;width:49%}
    tfoot,tfoot tr{display:flex;width:100%;border-radius:8px;overflow:hidden}
    tfoot td{display:block;width:auto;flex:1;text-align:left!important}
    tfoot td:empty{display:none}
  }
</style>
</head>
<body>
<header>
  <div class="t">
    <h1>SURAT PERINTAH LEMBUR (SPL)</h1>
    <small><?= namaPerusahaan ?></small>
  </div>
  <div class="u hide" id="userBox">
    <div id="userNama" style="font-weight:bold"></div>
    <div id="userJab"></div>
    <button onclick="keluar()">Keluar</button>
  </div>
</header>

<main>
  <!-- ============ LOGIN ============ -->
  <div id="vLogin" class="card login hide">
    <h3 style="margin-top:0">Masuk</h3>
    <p class="sub" style="font-size:13px">Masukkan email Anda yang terdaftar. Kode masuk 6 angka akan dikirim ke email tersebut.</p>
    <div id="lStep1">
      <label>Email</label>
      <input id="lEmail" type="email" placeholder="nama@email.com" autocomplete="email">
      <div style="margin-top:12px"><button class="btn" id="bKirim" onclick="mintaKode()">Kirim kode</button></div>
    </div>
    <div id="lStep2" class="hide">
      <label>Kode dari email</label>
      <input id="lKode" inputmode="numeric" maxlength="6" placeholder="6 angka" style="font-size:20px;letter-spacing:6px">
      <div style="margin-top:12px;display:flex;gap:8px">
        <button class="btn" id="bMasuk" onclick="masuk()">Masuk</button>
        <button class="btn sec" onclick="ulangLogin()">Ganti email</button>
      </div>
    </div>
    <div id="lMsg"></div>
  </div>

  <div id="vLoad" class="card" style="text-align:center;color:var(--mute)">Memuat…</div>

  <!-- ============ APLIKASI ============ -->
  <div id="vApp" class="hide">
    <div class="tabs">
      <button id="tBuat" class="on" onclick="tab('buat')">+ Buat SPL</button>
      <button id="tRiwayat" onclick="tab('riwayat')">SPL Saya</button>
    </div>

    <section id="pBuat">
      <div class="card">
        <div class="row">
          <div style="max-width:200px"><label>Tanggal Lembur *</label><input id="fTgl" type="date" onchange="hitungSemua()"></div>
          <div style="max-width:150px"><label>Hari</label><div class="chip" id="fHari">–</div></div>
          <div style="max-width:170px"><label>Status Hari</label><div class="chip" id="fStatus">–</div></div>
          <div><label>Jam mulai paling awal</label><div class="chip" id="fMin">–</div></div>
        </div>
        <div id="fInfo"></div>
      </div>

      <div class="card" style="padding:0;overflow:auto">
        <table>
          <thead><tr>
            <th>No</th><th style="min-width:230px">Karyawan</th><th>Jam Mulai</th><th>Jam Selesai</th>
            <th>Istirahat</th><th>Jam Efektif</th><th style="min-width:220px">Uraian Pekerjaan</th><th></th>
          </tr></thead>
          <tbody id="rows"></tbody>
          <tfoot><tr><td colspan="5" style="text-align:right">TOTAL JAM LEMBUR</td><td id="totJam" style="text-align:center">0</td><td colspan="2"></td></tr></tfoot>
        </table>
      </div>

      <div class="bar">
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn sec kecil" onclick="tambahBaris()">+ Tambah karyawan</button>
          <button class="btn sec kecil" onclick="samakan()" title="Salin jam & uraian baris 1 ke semua baris">⇩ Samakan dengan baris 1</button>
        </div>
        <div class="sum"><b id="sumOrang">0</b> karyawan · <b id="sumJam">0</b> jam</div>
      </div>
      <div id="errBox"></div>
      <div class="bar" style="justify-content:flex-end">
        <button class="btn" id="bSimpan" onclick="simpan()">Kirim SPL</button>
      </div>
    </section>

    <section id="pRiwayat" class="hide">
      <div class="card">
        <div class="bar" style="margin-top:0"><b>SPL yang saya buat</b><button class="btn sec kecil" onclick="muatRiwayat()">↻ Muat ulang</button></div>
        <div id="riwayat" style="margin-top:10px"></div>
      </div>
    </section>
  </div>
</main>

<div id="modal" class="modal hide"><div class="card" id="modalIsi"></div></div>

<script>
/* ===== rumus bersama dari server (Inti.gs) ===== */
<?!= rumusBersama ?>

/* ===== state ===== */
let TOKEN = null, D = null, ROWS = [], uid = 0;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtJam = n => (Math.round(n * 100) / 100).toString().replace('.', ',');
function run(fn) {
  const args = [].slice.call(arguments, 1);
  return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn].apply(null, args));
}
function pesan(el, tipe, html) { $(el).innerHTML = html ? '<div class="msg ' + tipe + '">' + html + '</div>' : ''; }
function errText(e) { return (e && e.message ? e.message : String(e)).replace(/^Error:\s*/, ''); }
function simpanToken(t) { try { t ? localStorage.setItem('spl_tok', t) : localStorage.removeItem('spl_tok'); } catch (e) {} }
function bacaToken() { try { return localStorage.getItem('spl_tok'); } catch (e) { return null; } }
function sibuk(btn, on, teks) { btn.disabled = on; btn.innerHTML = on ? '<span class="spin"></span>' + teks : btn.dataset.t || btn.innerHTML; }

/* ===== login ===== */
async function mulai() {
  const tok = bacaToken();
  if (tok) { try { await masukDengan(tok); return; } catch (e) { simpanToken(null); } }
  try {
    const r = await run('loginOtomatis');
    if (r.token) { await masukDengan(r.token); return; }
  } catch (e) {}
  tampil('vLogin');
}
function tampil(v) { ['vLogin', 'vLoad', 'vApp'].forEach(x => $(x).classList.toggle('hide', x !== v)); }
async function mintaKode() {
  const b = $('bKirim'); b.dataset.t = 'Kirim kode'; sibuk(b, true, 'Mengirim…'); pesan('lMsg');
  try {
    const m = await run('kirimKode', $('lEmail').value);
    $('lStep1').classList.add('hide'); $('lStep2').classList.remove('hide'); $('lKode').focus();
    pesan('lMsg', 'ok', esc(m) + '. Cek juga folder Spam.');
  } catch (e) { pesan('lMsg', 'err', esc(errText(e))); }
  sibuk(b, false);
}
async function masuk() {
  const b = $('bMasuk'); b.dataset.t = 'Masuk'; sibuk(b, true, 'Memeriksa…'); pesan('lMsg');
  try {
    const r = await run('verifikasiKode', $('lEmail').value, $('lKode').value);
    await masukDengan(r.token);
  } catch (e) { pesan('lMsg', 'err', esc(errText(e))); }
  sibuk(b, false);
}
function ulangLogin() { $('lStep2').classList.add('hide'); $('lStep1').classList.remove('hide'); $('lKode').value = ''; pesan('lMsg'); }
async function masukDengan(tok) {
  tampil('vLoad');
  D = await run('dataForm', tok);
  TOKEN = tok; simpanToken(tok);
  $('userNama').textContent = D.user.nama; $('userJab').textContent = D.user.jabatan + ' · ' + D.user.peran;
  $('userBox').classList.remove('hide');
  ROWS = []; $('rows').innerHTML = ''; tambahBaris(); hitungSemua();
  tampil('vApp');
}
function keluar() { simpanToken(null); TOKEN = null; $('userBox').classList.add('hide'); ulangLogin(); tampil('vLogin'); }
function sesiHabis(e) {
  if (errText(e).indexOf('SESI_HABIS') >= 0) { keluar(); pesan('lMsg', 'warn', 'Sesi berakhir, silakan masuk lagi.'); return true; }
  return false;
}
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (document.activeElement === $('lEmail')) mintaKode();
  if (document.activeElement === $('lKode')) masuk();
});

/* ===== tab ===== */
function tab(t) {
  $('pBuat').classList.toggle('hide', t !== 'buat'); $('pRiwayat').classList.toggle('hide', t !== 'riwayat');
  $('tBuat').classList.toggle('on', t === 'buat'); $('tRiwayat').classList.toggle('on', t === 'riwayat');
  if (t === 'riwayat') muatRiwayat();
}

/* ===== baris karyawan ===== */
function opsiKaryawan(pilih) {
  let h = '<option value="">— pilih karyawan —</option>', dep = null;
  D.karyawan.forEach(k => {
    if (k.departemen !== dep) { if (dep !== null) h += '</optgroup>'; dep = k.departemen; h += '<optgroup label="' + esc(dep) + '">'; }
    h += '<option value="' + esc(k.id) + '"' + (k.id === pilih ? ' selected' : '') + '>' + esc(k.id + ' — ' + k.nama) + '</option>';
  });
  return h + '</optgroup>';
}
function opsiJam(pilih) {
  return '<option value="">--:--</option>' + D.jam.map(j => '<option' + (j === pilih ? ' selected' : '') + '>' + j + '</option>').join('');
}
function tambahBaris(data) {
  const maks = Number(D.P.MAKS_KARYAWAN_PER_SPL) || 30;
  if (ROWS.length >= maks) { alert('Maksimal ' + maks + ' karyawan per SPL.'); return; }
  const d = data || {}, prev = ROWS[ROWS.length - 1];
  const id = ++uid;
  const tr = document.createElement('tr'); tr.id = 'r' + id;
  tr.innerHTML =
    '<td class="n"></td>' +
    '<td data-l="Karyawan"><select class="k" onchange="hitungSemua()">' + opsiKaryawan(d.id) + '</select><div class="sub jab"></div><div class="rowerr"></div><div class="rowwarn"></div></td>' +
    '<td class="jam" data-l="Jam Mulai"><select class="m" onchange="hitungSemua()">' + opsiJam(d.mulai || (prev && prev.el.querySelector('.m').value) || '') + '</select></td>' +
    '<td class="jam" data-l="Jam Selesai"><select class="s" onchange="hitungSemua()">' + opsiJam(d.selesai || (prev && prev.el.querySelector('.s').value) || '') + '</select></td>' +
    '<td class="auto ist" data-l="Istirahat">-</td>' +
    '<td class="auto ef" data-l="Jam Efektif">-</td>' +
    '<td data-l="Uraian Pekerjaan"><textarea class="u" rows="2" placeholder="Contoh: Welding frame project X" oninput="hitungSemua()">' + esc(d.uraian || '') + '</textarea></td>' +
    '<td class="aksi"><button class="del" title="Hapus baris" onclick="hapusBaris(' + id + ')">✕</button></td>';
  $('rows').appendChild(tr);
  ROWS.push({ id: id, el: tr });
  hitungSemua();
}
function hapusBaris(id) {
  if (ROWS.length === 1) { const r = ROWS[0].el; r.querySelector('.k').value = ''; r.querySelector('.u').value = ''; hitungSemua(); return; }
  ROWS = ROWS.filter(r => r.id !== id); $('r' + id).remove(); hitungSemua();
}
function samakan() {
  if (!ROWS.length) return;
  const a = ROWS[0].el, m = a.querySelector('.m').value, s = a.querySelector('.s').value, u = a.querySelector('.u').value;
  ROWS.slice(1).forEach(r => { r.el.querySelector('.m').value = m; r.el.querySelector('.s').value = s; if (!r.el.querySelector('.u').value.trim()) r.el.querySelector('.u').value = u; });
  hitungSemua();
}

/* ===== hitung (rumus sama dengan server) ===== */
let SIAP = false;
function hitungSemua() {
  if (!D) return;
  const tgl = $('fTgl').value;
  const t = keTanggal_(tgl);
  if (t) {
    const st = statusHari_(t, D.libur), hk = hariKe_(t);
    $('fHari').textContent = NAMA_HARI[hk - 1];
    $('fStatus').textContent = st + (D.libur[ymd_(t)] ? ' (' + D.libur[ymd_(t)] + ')' : '');
    $('fStatus').className = 'chip ' + (st === 'Hari Libur' ? 'libur' : 'kerja');
    $('fMin').textContent = (st === 'Hari Libur' ? D.P.JAM_MULAI_MIN_LIBUR : hk === 6 ? D.P.JAM_MULAI_MIN_SABTU : D.P.JAM_MULAI_MIN_SENJUM) + '  ·  selesai maks ' + D.P.JAM_SELESAI_MAKS;
  } else { $('fHari').textContent = '–'; $('fStatus').textContent = '–'; $('fStatus').className = 'chip'; $('fMin').textContent = '–'; }

  let tot = 0, orang = 0, adaErr = false; const dipakai = {}, warnUU = [];
  ROWS.forEach((r, i) => {
    const el = r.el, id = el.querySelector('.k').value, m = el.querySelector('.m').value, s = el.querySelector('.s').value, u = el.querySelector('.u').value.trim();
    el.querySelector('.n').textContent = i + 1;
    const k = D.karyawan.find(x => x.id === id);
    el.querySelector('.jab').textContent = k ? k.jabatan + ' · ' + k.departemen : '';
    const e = [], w = [];
    let h = null;
    if (id) {
      orang++;
      if (dipakai[id]) e.push('Karyawan ini sudah ada di baris ' + dipakai[id] + '.'); else dipakai[id] = i + 1;
      if (!tgl) e.push('Isi Tanggal Lembur terlebih dahulu.');
      else if (m && s) { h = hitungLembur_({ tanggal: tgl, mulai: m, selesai: s, gaji: 0 }, D.P, D.libur); e.push.apply(e, h.error); w.push.apply(w, h.peringatan); }
      else e.push('Pilih jam mulai & jam selesai.');
      if (!u) e.push('Uraian pekerjaan wajib diisi.');
    }
    el.querySelector('.ist').textContent = h && !h.error.length ? h.istirahat : '-';
    el.querySelector('.ef').textContent = h && !h.error.length ? fmtJam(h.jamEfektif) : '-';
    if (h && !h.error.length) tot += h.jamEfektif;
    el.querySelector('.rowerr').textContent = e.join(' ');
    el.querySelector('.rowwarn').textContent = w.length ? '⚠ ' + w.join(' ') : '';
    if (w.length && k) warnUU.push(k.nama);
    if (e.length) adaErr = true;
  });
  $('totJam').textContent = fmtJam(tot); $('sumJam').textContent = fmtJam(tot); $('sumOrang').textContent = orang;
  pesan('fInfo', 'warn', warnUU.length ? '⚠ Perusahaan melanggar UU Ketenagakerjaan karena mempekerjakan karyawan melebihi batas (' + esc(warnUU.join(', ')) + ').' : '');
  SIAP = !adaErr && orang > 0 && !!tgl;
  $('bSimpan').disabled = !SIAP;
}

/* ===== simpan ===== */
function kumpulkan() {
  return {
    tanggal: $('fTgl').value,
    baris: ROWS.map(r => ({ id: r.el.querySelector('.k').value, mulai: r.el.querySelector('.m').value, selesai: r.el.querySelector('.s').value, uraian: r.el.querySelector('.u').value }))
      .filter(b => b.id)
  };
}
function simpan() {
  hitungSemua(); if (!SIAP) return;
  const d = kumpulkan();
  const t = keTanggal_(d.tanggal);
  modal('<h3 style="margin-top:0">Kirim SPL?</h3><p>Tanggal <b>' + NAMA_HARI[hariKe_(t) - 1] + ', ' + t.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }) +
    '</b><br><b>' + d.baris.length + '</b> karyawan · <b>' + $('totJam').textContent + '</b> jam lembur</p>' +
    '<p class="sub">Setelah dikirim, SPL masuk ke proses persetujuan dan tidak bisa diubah dari form.</p>' +
    '<div class="bar" style="justify-content:flex-end"><button class="btn sec" onclick="tutupModal()">Periksa lagi</button><button class="btn" id="bYa" onclick="kirim()">Ya, kirim</button></div>');
}
async function kirim() {
  const b = $('bYa'); sibuk(b, true, 'Menyimpan…'); pesan('errBox');
  try {
    const r = await run('simpanSPL', TOKEN, kumpulkan());
    if (!r.ok) {
      tutupModal();
      pesan('errBox', 'err', '<b>SPL belum tersimpan:</b><br>' + r.error.map(esc).join('<br>'));
      return;
    }
    formBaru();   // kosongkan form agar tidak terkirim dua kali
    modal('<h3 style="margin-top:0;color:var(--ok)">✅ SPL tersimpan</h3>' +
      '<p>Nomor: <b style="font-size:16px">' + esc(r.nomor) + '</b><br>' + r.jumlah + ' karyawan · ' + fmtJam(r.totalJam) + ' jam<br>Status: <span class="st MENUNGGU">' + esc(r.status) + '</span></p>' +
      '<div class="bar" style="justify-content:flex-end"><button class="btn sec" onclick="tutupModal();tab(\'riwayat\')">Lihat SPL Saya</button><button class="btn" onclick="tutupModal();formBaru()">Buat SPL baru</button></div>');
  } catch (e) {
    tutupModal();
    if (!sesiHabis(e)) pesan('errBox', 'err', esc(errText(e)));
  }
}
function formBaru() { $('fTgl').value = ''; ROWS = []; $('rows').innerHTML = ''; tambahBaris(); pesan('errBox'); hitungSemua(); window.scrollTo(0, 0); }
function modal(h) { $('modalIsi').innerHTML = h; $('modal').classList.remove('hide'); }
function tutupModal() { $('modal').classList.add('hide'); }

/* ===== riwayat ===== */
async function muatRiwayat() {
  $('riwayat').innerHTML = '<div class="sub">Memuat…</div>';
  try {
    const L = await run('riwayatSPL', TOKEN);
    if (!L.length) { $('riwayat').innerHTML = '<div class="sub">Belum ada SPL.</div>'; return; }
    $('riwayat').innerHTML = L.map(x => {
      const t = keTanggal_(x.tanggal), kelas = String(x.status).split(' ')[0];
      return '<div class="rw" onclick="this.classList.toggle(\'buka\')">' +
        '<div class="bar" style="margin:0"><div><b>' + esc(x.nomor) + '</b><div class="sub">' + esc(x.hari) + ', ' + (t ? t.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) : '') +
        ' · ' + esc(x.statusHari) + ' · ' + x.orang.length + ' orang · ' + fmtJam(x.totalJam) + ' jam</div></div><span class="st ' + esc(kelas) + '">' + esc(x.status) + '</span></div>' +
        '<div class="det">' + x.orang.map(o => '• <b>' + esc(o.nama) + '</b> ' + esc(o.mulai) + '–' + esc(o.selesai) + ' (' + fmtJam(o.jam) + ' jam) — ' + esc(o.uraian)).join('<br>') + '</div></div>';
    }).join('');
  } catch (e) { if (!sesiHabis(e)) $('riwayat').innerHTML = '<div class="msg err">' + esc(errText(e)) + '</div>'; }
}

mulai();
</script>
