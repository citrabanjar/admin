<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPL &amp; SPD — PT Citra Banjar Abadi</title>
<meta name="robots" content="noindex">
<style>
  html,body{margin:0;height:100%;background:#F5F5F6;font-family:Arial,Helvetica,sans-serif}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  #muat{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#6B6F76;font-size:14px}
  .spin{width:34px;height:34px;border:4px solid #E2E4E8;border-top-color:#BE353F;border-radius:50%;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  #muat a{color:#BE353F}
</style>
</head>
<body>
<div id="muat"><div class="spin"></div><div>Memuat form SPL &amp; SPD…</div>
  <div id="alt" style="display:none">Belum muncul? <a id="langsung" href="#">Buka form langsung</a></div></div>
<script src="form-url.js"></script>
<script>
  // Form asli berjalan di Google Apps Script; halaman ini hanya "pintu masuk" dengan alamat pendek.
  // Parameter link email (?a=…&id=…&s=…) diteruskan apa adanya.
  // Alamat Web App ditulis otomatis oleh GitHub Actions (docs/form-url.js) dari deployment yang selalu diperbarui.
  var APPS_SCRIPT = window.FORM_URL || 'https://script.google.com/macros/s/AKfycbxyUOucRU0IpoD4AuRFBjHkm83NJ80xJzwVQ8Aj66dr-dmkMAc/exec';
  var tujuan = APPS_SCRIPT + location.search;
  document.getElementById('langsung').href = tujuan;
  var f = document.createElement('iframe');
  f.src = tujuan;
  f.title = 'Form SPL & SPD';
  f.allow = 'clipboard-write';
  f.onload = function () { document.getElementById('muat').style.display = 'none'; };
  document.body.appendChild(f);
  setTimeout(function () { document.getElementById('alt').style.display = 'block'; }, 8000);
</script>
</body>
</html>
